<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>para ti 🖤</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #050505;
      --white: #f5f5f7;
      --gray: #a7a7ad;

      /* Rojo perlado */
      --pearl-red: #d94b64;
      --pearl-light: #f08a9b;
      --pearl-dark: #721528;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--black);
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      color: var(--white);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* =========================
       FONDO
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;

      background:
        radial-gradient(
          circle at 50% 50%,
          #12070a 0%,
          #070506 42%,
          #030303 100%
        );
    }

    .glow {
      position: absolute;

      width: 560px;
      height: 560px;

      border-radius: 50%;

      filter: blur(125px);

      pointer-events: none;

      transition:
        transform 2s cubic-bezier(.2,.8,.2,1);
    }

    .glow.one {
      top: -280px;
      left: -220px;

      background:
        radial-gradient(
          circle,
          rgba(240,138,155,.65),
          rgba(217,75,100,.22),
          transparent 70%
        );

      opacity: .25;
    }

    .glow.two {
      right: -300px;
      bottom: -300px;

      width: 680px;
      height: 680px;

      background:
        radial-gradient(
          circle,
          rgba(217,75,100,.50),
          rgba(114,21,40,.16),
          transparent 70%
        );

      opacity: .22;
    }

    .glow.three {
      width: 430px;
      height: 430px;

      left: 40%;
      top: 42%;

      background:
        radial-gradient(
          circle,
          rgba(240,138,155,.22),
          transparent 70%
        );

      opacity: .13;
    }

    /* =========================
       TEXTURA
    ========================= */

    .noise {
      position: fixed;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      opacity: .015;

      background-image:
        radial-gradient(
          rgba(255,255,255,.8) .5px,
          transparent .5px
        );

      background-size: 5px 5px;
    }

    /* =========================
       LUZ DEL MOUSE
    ========================= */

    .cursor-light {
      position: fixed;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      z-index: 1;

      background:
        radial-gradient(
          circle,
          rgba(240,138,155,.075),
          transparent 68%
        );
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .experience {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }

    /* =========================
       ESCENAS
    ========================= */

    .scene {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      opacity: 0;

      pointer-events: none;

      transform:
        scale(.985)
        translateY(12px);

      filter: blur(7px);

      transition:
        opacity .9s cubic-bezier(.2,.8,.2,1),
        transform 1s cubic-bezier(.2,.8,.2,1),
        filter 1s cubic-bezier(.2,.8,.2,1);
    }

    .scene.active {
      opacity: 1;

      pointer-events: auto;

      transform:
        scale(1)
        translateY(0);

      filter: blur(0);
    }

    /* =========================
       TEXTO
    ========================= */

    .text-scene {
      flex-direction: column;
      text-align: center;
    }

    .main-title {
      max-width: 900px;

      font-size:
        clamp(39px, 9vw, 78px);

      line-height: 1.02;

      font-weight: 300;

      letter-spacing: -.055em;

      color: #f5f5f7;

      opacity: 0;

      transform: translateY(18px);

      transition:
        opacity 1s cubic-bezier(.2,.8,.2,1) .15s,
        transform 1s cubic-bezier(.2,.8,.2,1) .15s;
    }

    .scene.active .main-title {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       PEQUEÑO REFLEJO ROJO
    ========================= */

    .red-reflection {
      width: 42px;
      height: 2px;

      margin-bottom: 28px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--pearl-light),
          var(--pearl-red),
          transparent
        );

      box-shadow:
        0 0 18px rgba(217,75,100,.45);

      opacity: 0;

      transform:
        scaleX(.2);

      transition:
        opacity .9s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);
    }

    .scene.active .red-reflection {
      opacity: .9;
      transform: scaleX(1);
    }

    /* =========================
       TARJETA VIDRIO
    ========================= */

    .glass-card {
      width: min(90vw, 580px);

      padding: 48px 34px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.065),
          rgba(255,255,255,.018)
        );

      backdrop-filter:
        blur(34px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(34px)
        saturate(125%);

      box-shadow:
        0 30px 90px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.09);

      text-align: center;

      opacity: 0;

      transform:
        translateY(18px)
        scale(.98);

      transition:
        opacity 1s ease .2s,
        transform 1s cubic-bezier(.2,.8,.2,1) .2s;
    }

    .scene.active .glass-card {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }

    .glass-card h2 {
      font-size:
        clamp(30px, 7vw, 48px);

      line-height: 1.05;

      font-weight: 300;

      letter-spacing: -.05em;
    }

    .small-text {
      margin-top: 18px;

      font-size: 15px;

      line-height: 1.6;

      color:
        rgba(245,245,247,.52);
    }

    /* =========================
       BOTÓN
    ========================= */

    .glass-button {
      margin-top: 30px;

      padding:
        11px 12px 11px 20px;

      display: inline-flex;

      align-items: center;

      gap: 14px;

      border:
        1px solid rgba(255,255,255,.13);

      border-radius: 999px;

      background:
        rgba(255,255,255,.045);

      color:
        rgba(255,255,255,.88);

      font-family: inherit;
      font-size: 15px;

      cursor: pointer;

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 15px 40px rgba(0,0,0,.22);

      transition:
        background .35s ease,
        border-color .35s ease,
        transform .35s ease;
    }

    .glass-button:hover {
      background:
        rgba(217,75,100,.10);

      border-color:
        rgba(240,138,155,.30);

      transform:
        translateY(-2px);
    }

    .button-arrow {
      width: 30px;
      height: 30px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          rgba(240,138,155,.22),
          rgba(114,21,40,.14)
        );

      font-size: 20px;
    }

    /* =========================
       TRANSICIÓN
    ========================= */

    .transition {
      position: fixed;
      inset: 0;

      z-index: 50;

      pointer-events: none;

      opacity: 0;

      background:
        rgba(3,3,3,.10);

      backdrop-filter: blur(0);

      -webkit-backdrop-filter: blur(0);

      transition:
        opacity .7s ease,
        backdrop-filter .7s ease;
    }

    .transition.active {
      opacity: 1;

      backdrop-filter:
        blur(24px)
        saturate(90%);

      -webkit-backdrop-filter:
        blur(24px)
        saturate(90%);
    }

    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 600px) {

      .scene {
        padding: 20px;
      }

      .cursor-light {
        display: none;
      }

      .glow {
        filter: blur(95px);
      }

    }

  </style>
</head>

<body>

  <div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

  </div>

  <div class="cursor-light"></div>

  <div class="noise"></div>


  <main class="experience">

    <!-- PARTE 1 -->

    <section
      class="scene text-scene active"
      id="scene1"
    >

      <div class="red-reflection"></div>

      <h1 class="main-title">
        Heeeeey vrujinii
      </h1>

    </section>


    <!-- PARTE 2 -->

    <section
      class="scene text-scene"
      id="scene2"
    >

      <h1 class="main-title">
        espera 😭
      </h1>

    </section>


    <!-- PARTE 3 -->

    <section
      class="scene text-scene"
      id="scene3"
    >

      <h1 class="main-title">
        antes de que digas “qué es esto”
      </h1>

    </section>


    <!-- PARTE 4 -->

    <section
      class="scene text-scene"
      id="scene4"
    >

      <h1 class="main-title">
        JAJAJA no sabía cómo empezar a decirte esto
      </h1>

    </section>


    <!-- PARTE 5 -->

    <section
      class="scene"
      id="scene5"
    >

      <div class="glass-card">

        <h2>
          pero bueno...
        </h2>

        <p class="small-text">
          aquí empieza lo importante 🩶
        </p>

        <button
          class="glass-button"
          id="continueButton"
        >

          continuar

          <span class="button-arrow">
            ›
          </span>

        </button>

      </div>

    </section>

  </main>


  <div
    class="transition"
    id="transition"
  ></div>


  <script>

    const scenes = [
      document.getElementById("scene1"),
      document.getElementById("scene2"),
      document.getElementById("scene3"),
      document.getElementById("scene4"),
      document.getElementById("scene5")
    ];

    const transition =
      document.getElementById("transition");

    const continueButton =
      document.getElementById("continueButton");


    function showScene(number) {

      transition.classList.add("active");

      setTimeout(() => {

        scenes.forEach(scene => {
          scene.classList.remove("active");
        });

        scenes[number].classList.add("active");

        setTimeout(() => {
          transition.classList.remove("active");
        }, 250);

      }, 430);
    }


    setTimeout(() => {
      showScene(1);
    }, 2400);

    setTimeout(() => {
      showScene(2);
    }, 5000);

    setTimeout(() => {
      showScene(3);
    }, 7900);

    setTimeout(() => {
      showScene(4);
    }, 11300);


    /* BOTÓN */

    continueButton.addEventListener(
      "click",
      () => {

        /*
          AQUÍ PONDREMOS
          LA SIGUIENTE PARTE
          DEL REGALO.
        */

      }
    );


    /* MOVIMIENTO DEL FONDO */

    const cursorLight =
      document.querySelector(".cursor-light");

    const glowOne =
      document.querySelector(".glow.one");

    const glowTwo =
      document.querySelector(".glow.two");

    const glowThree =
      document.querySelector(".glow.three");


    let targetX = 0;
    let targetY = 0;

    let currentX = 0;
    let currentY = 0;


    document.addEventListener(
      "mousemove",
      event => {

        const centerX =
          window.innerWidth / 2;

        const centerY =
          window.innerHeight / 2;


        targetX =
          (event.clientX - centerX)
          / centerX;

        targetY =
          (event.clientY - centerY)
          / centerY;


        cursorLight.style.left =
          event.clientX + "px";

        cursorLight.style.top =
          event.clientY + "px";

      }
    );


    function animateBackground() {

      currentX +=
        (targetX - currentX) * .045;

      currentY +=
        (targetY - currentY) * .045;


      glowOne.style.transform =
        `translate(
          ${currentX * 30}px,
          ${currentY * 24}px
        )`;

      glowTwo.style.transform =
        `translate(
          ${currentX * -25}px,
          ${currentY * -20}px
        )`;

      glowThree.style.transform =
        `translate(
          ${currentX * 40}px,
          ${currentY * 30}px
        )`;


      requestAnimationFrame(
        animateBackground
      );
    }


    animateBackground();

  </script>

</body>
</html>
