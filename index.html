<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>para ti</title>

<style>

/* ================================
   BASE
================================ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  background: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}


/* ================================
   PANTALLA
================================ */

.screen {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background: #ffffff;
}


/* ================================
   GLOBOS — FONDO
================================ */

.balloons {
  position: absolute;

  inset: 0;

  overflow: hidden;

  z-index: 1;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .8s ease;
}


/* ================================
   GLOBO
================================ */

.balloon {
  position: absolute;

  bottom: -180px;

  width: 58px;
  height: 74px;

  border-radius:
    50% 50% 47% 47%;

  opacity: .94;

  cursor: pointer;

  pointer-events: auto;

  box-shadow:
    0 12px 28px
    rgba(0,0,0,.10);

  will-change:
    transform;
}


/* brillo */

.balloon span {
  position: absolute;

  width: 12px;
  height: 22px;

  top: 13px;
  left: 15px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.78);

  filter: blur(1px);

  pointer-events: none;
}


/* cuerda */

.balloon::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 100%;

  width: 1px;
  height: 170px;

  background:
    rgba(70,70,70,.23);
}


/* nudo */

.balloon::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  transform:
    translateX(-50%);

  width: 8px;
  height: 9px;

  background: inherit;

  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 100%
    );
}


/* ================================
   COLORES DE FIESTA
================================ */

.red {
  background:
    linear-gradient(
      145deg,
      #ff6675,
      #ff003c 58%,
      #d9002f
    );
}

.blue {
  background:
    linear-gradient(
      145deg,
      #49c2ff,
      #006eff 58%,
      #0047d4
    );
}

.yellow {
  background:
    linear-gradient(
      145deg,
      #fff34d,
      #ffd000 58%,
      #eea900
    );
}

.pink {
  background:
    linear-gradient(
      145deg,
      #ff75bd,
      #ff1684 58%,
      #dc0068
    );
}

.green {
  background:
    linear-gradient(
      145deg,
      #52f59d,
      #00d86a 58%,
      #00a64e
    );
}

.purple {
  background:
    linear-gradient(
      145deg,
      #c866ff,
      #8b2cff 58%,
      #6414d6
    );
}

.orange {
  background:
    linear-gradient(
      145deg,
      #ff9c4a,
      #ff6417 58%,
      #e53c00
    );
}

.turquoise {
  background:
    linear-gradient(
      145deg,
      #4ff5e8,
      #00cfc1 58%,
      #009b92
    );
}


/* ================================
   SUBIDA RÁPIDA
================================ */

@keyframes rise {

  0% {
    transform:
      translate3d(0, 0, 0)
      rotate(-5deg);
  }

  25% {
    transform:
      translate3d(25px, -30vh, 0)
      rotate(5deg);
  }

  50% {
    transform:
      translate3d(-22px, -65vh, 0)
      rotate(-4deg);
  }

  75% {
    transform:
      translate3d(28px, -95vh, 0)
      rotate(5deg);
  }

  100% {
    transform:
      translate3d(-18px, -145vh, 0)
      rotate(-3deg);
  }
}


/* ================================
   MUCHOS GLOBOS
================================ */

.balloon:nth-child(1) {
  left: 1%;
  animation:
    rise 4.8s linear infinite;
}

.balloon:nth-child(2) {
  left: 10%;
  width: 72px;
  height: 92px;
  animation:
    rise 5.6s linear infinite .5s;
}

.balloon:nth-child(3) {
  left: 20%;
  width: 52px;
  height: 67px;
  animation:
    rise 4.4s linear infinite 1.2s;
}

.balloon:nth-child(4) {
  left: 30%;
  width: 82px;
  height: 104px;
  animation:
    rise 6s linear infinite .8s;
}

.balloon:nth-child(5) {
  left: 41%;
  width: 58px;
  height: 74px;
  animation:
    rise 4.7s linear infinite 1.7s;
}

.balloon:nth-child(6) {
  left: 51%;
  width: 75px;
  height: 95px;
  animation:
    rise 5.4s linear infinite .2s;
}

.balloon:nth-child(7) {
  left: 62%;
  width: 55px;
  height: 70px;
  animation:
    rise 4.5s linear infinite 1.5s;
}

.balloon:nth-child(8) {
  left: 71%;
  width: 88px;
  height: 112px;
  animation:
    rise 6.2s linear infinite .9s;
}

.balloon:nth-child(9) {
  left: 82%;
  width: 60px;
  height: 77px;
  animation:
    rise 4.6s linear infinite 2s;
}

.balloon:nth-child(10) {
  left: 91%;
  width: 78px;
  height: 99px;
  animation:
    rise 5.7s linear infinite .3s;
}


/* ================================
   CONTENIDO — DELANTE
================================ */

.content {
  position: relative;

  z-index: 10;

  width: 100%;
  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  transition:
    opacity 1s ease,
    transform 1s
    cubic-bezier(.2,.8,.2,1);
}


/* ================================
   TU FOTO
================================ */

.photo {
  width:
    min(72vw, 360px);

  height:
    min(72vw, 360px);

  border-radius:
    30px;

  overflow:
    hidden;

  background:
    transparent;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.10);
}

.photo img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* ================================
   BOTÓN
================================ */

.button {
  margin-top: 28px;

  min-height: 47px;

  padding:
    0 9px 0 20px;

  border-radius: 999px;

  border:
    1px solid
    rgba(0,0,0,.12);

  background:
    rgba(255,255,255,.84);

  color:
    #1d1d1f;

  font-family:
    inherit;

  font-size: 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 12px;

  cursor: pointer;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.08);

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.button:hover {
  transform:
    translateY(-2px);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.13);
}


/* ================================
   FLECHA
================================ */

.arrow {
  width: 25px;
  height: 25px;

  flex:
    0 0 25px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    #1d1d1f;

  color:
    #ffffff;

  font-size:
    13px;

  font-weight:
    300;

  line-height:
    1;

  padding:
    0 0 1px 1px;
}


/* ================================
   CLICK EN CONTINUAR
================================ */

.started .balloons {
  opacity: 1;
}

.started .content {
  transform:
    translateY(-22px)
    scale(.97);

  opacity: .10;
}


/* ================================
   EXPLOSIÓN
================================ */

.pop {
  position: absolute;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  pointer-events: none;

  z-index: 5;

  animation:
    popParticle
    .55s
    ease-out
    forwards;
}


@keyframes popParticle {

  0% {
    transform:
      translate(0,0)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(.15);

    opacity: 0;
  }
}


.balloon.popping {
  animation:
    none !important;

  transform:
    scale(.15);

  opacity:
    0;
}


/* ================================
   CELULAR
================================ */

@media (max-width: 600px) {

  .photo {
    width: 75vw;
    height: 75vw;

    border-radius: 26px;
  }

}

</style>

</head>


<body>


<div
  class="screen"
  id="screen"
>


  <!-- =================================
       GLOBOS DEL FONDO
  ================================== -->

  <div
    class="balloons"
    id="balloons"
  >

    <div class="balloon red">
      <span></span>
    </div>

    <div class="balloon blue">
      <span></span>
    </div>

    <div class="balloon yellow">
      <span></span>
    </div>

    <div class="balloon pink">
      <span></span>
    </div>

    <div class="balloon green">
      <span></span>
    </div>

    <div class="balloon purple">
      <span></span>
    </div>

    <div class="balloon orange">
      <span></span>
    </div>

    <div class="balloon turquoise">
      <span></span>
    </div>

    <div class="balloon red">
      <span></span>
    </div>

    <div class="balloon yellow">
      <span></span>
    </div>

  </div>


  <!-- =================================
       FOTO + BOTÓN
  ================================== -->

  <div
    class="content"
    id="content"
  >

    <div
      class="photo"
      id="photo"
    >

      <img
        src="foto.jpeg"
        alt=""
      >

    </div>


    <button
      class="button"
      id="startButton"
    >

      continuar

      <span class="arrow">
        &rsaquo;
      </span>

    </button>

  </div>


</div>


<script>


const screen =
  document.getElementById(
    "screen"
  );


const button =
  document.getElementById(
    "startButton"
  );


const balloons =
  document.querySelectorAll(
    ".balloon"
  );


/* ================================
   CONTINUAR
================================ */

button.addEventListener(
  "click",
  () => {

    screen.classList.add(
      "started"
    );

  }
);


/* ================================
   EXPLOTAR GLOBOS
================================ */

balloons.forEach(
  balloon => {

    balloon.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          balloon.classList.contains(
            "popping"
          )
        ) {
          return;
        }


        const rect =
          balloon.getBoundingClientRect();


        const centerX =
          rect.left +
          rect.width / 2;


        const centerY =
          rect.top +
          rect.height / 2;


        const colors = [

          "#ff003c",
          "#006eff",
          "#ffd000",
          "#ff1684",
          "#00d86a",
          "#8b2cff",
          "#ff6417",
          "#00cfc1"

        ];


        /* partículas */

        for (
          let i = 0;
          i < 16;
          i++
        ) {

          const particle =
            document.createElement(
              "div"
            );


          particle.className =
            "pop";


          particle.style.left =
            centerX + "px";


          particle.style.top =
            centerY + "px";


          const angle =
            Math.random()
            * Math.PI
            * 2;


          const distance =
            35 +
            Math.random() * 70;


          particle.style.setProperty(
            "--x",
            Math.cos(angle)
            * distance
            + "px"
          );


          particle.style.setProperty(
            "--y",
            Math.sin(angle)
            * distance
            + "px"
          );


          particle.style.background =
            colors[
              Math.floor(
                Math.random()
                * colors.length
              )
            ];


          document.body.appendChild(
            particle
          );


          setTimeout(
            () => {
              particle.remove();
            },
            600
          );

        }


        balloon.classList.add(
          "popping"
        );


        /* reaparece después */

        setTimeout(
          () => {

            balloon.classList.remove(
              "popping"
            );

          },
          700
        );

      }

    );

  }
);


</script>


</body>

</html>
